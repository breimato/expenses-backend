spring:
  application:
    name: expenses
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:expenses_db}
    username: ${DB_USERNAME:expenses_user}
    password: ${DB_PASSWORD:expenses_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}

expenses:
  recurring:
    apply-on-startup: false
