description: "Get Analytics Period Average V1 Request"
type: object
required:
  - dateFrom
  - dateTo
  - accountId
properties:
  accountId:
    type: integer
    format: int32
    description: "Account identifier"
  dateFrom:
    type: string
    format: date
    description: "Inclusive start date of the average period"
  dateTo:
    type: string
    format: date
    description: "Inclusive end date of the average period"
