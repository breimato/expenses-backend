delete:
  summary: "Delete Account Invitation V1"
  description: "Revoke a pending invitation (OWNER only)"
  operationId: "DeleteAccountInvitationV1"
  tags:
    - delete-account-invitation-v1
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
    - name: invitationId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  responses:
    '204':
      description: "204 No Content"
    '403':
      description: "Forbidden"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
    '404':
      $ref: '../es-expenses.api.yaml#/components/responses/NotFound'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
