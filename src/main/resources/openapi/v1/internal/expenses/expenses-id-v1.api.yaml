patch:
  summary: "Patch Expense V1"
  description: "Partially update an expense"
  operationId: "PatchExpenseV1"
  tags:
    - patch-expense-v1
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: "Expense identifier"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PatchExpenseV1Request.yaml'
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/ExpenseV1Response.yaml'
    '404':
      description: "Not Found - Expense not found"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
delete:
  summary: "Delete Expense V1"
  description: "Delete an expense"
  operationId: "DeleteExpenseV1"
  tags:
    - delete-expense-v1
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: "Expense identifier"
  responses:
    '204':
      description: "204 No Content"
    '404':
      description: "Not Found - Expense not found"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
