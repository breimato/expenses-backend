get:
  summary: "Get Categories V1"
  description: "Get all categories, optionally filtered by search criteria"
  operationId: "GetCategoriesV1"
  tags:
    - get-categories-v1
  parameters:
    - name: id
      in: query
      required: false
      schema:
        type: integer
        format: int32
    - name: name
      in: query
      required: false
      schema:
        type: string
    - name: movementType
      in: query
      required: false
      schema:
        $ref: '../components/MovementTypeV1.yaml'
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/GetCategoriesV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
post:
  summary: "Post Category V1"
  description: "Create a new category"
  operationId: "PostCategoryV1"
  tags:
    - post-category-v1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PostCategoryV1Request.yaml'
  responses:
    '201':
      description: "201 Created"
      content:
        application/json:
          schema:
            $ref: '../responses/CategoryV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
