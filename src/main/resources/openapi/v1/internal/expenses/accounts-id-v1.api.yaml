get:
  summary: "Get Account V1"
  description: "Get a single account by id"
  operationId: "GetAccountV1"
  tags:
    - get-account-v1
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/AccountV1Response.yaml'
    '404':
      $ref: '../es-expenses.api.yaml#/components/responses/NotFound'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
patch:
  summary: "Patch Account V1"
  description: "Partially update an account"
  operationId: "PatchAccountV1"
  tags:
    - patch-account-v1
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PatchAccountV1Request.yaml'
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/AccountV1Response.yaml'
    '404':
      $ref: '../es-expenses.api.yaml#/components/responses/NotFound'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
