post:
  summary: "Post Auth Login V1"
  description: "Login with email and password"
  operationId: "PostAuthLoginV1"
  tags:
    - post-auth-login-v1
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PostAuthLoginV1Request.yaml'
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/AuthV1Response.yaml'
    '401':
      description: "Unauthorized"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
