description: "Account invitation preview V1"
type: object
properties:
  accountId:
    type: integer
    format: int32
    description: "Account id"
  accountName:
    type: string
    description: "Account display name"
  status:
    type: string
    enum:
      - PENDING
      - ACCEPTED
      - EXPIRED
      - REVOKED
    description: "Invitation status"
  expiresAt:
    type: string
    format: date-time
    description: "Expiration timestamp"
  alreadyMember:
    type: boolean
    description: "Whether the current user is already a member of the account"
