description: "Analytics Period Average V1"
type: object
properties:
  dailyAverage:
    type: string
    description: "Daily average net spending for the inclusive date range"
  totalNetSpending:
    type: string
    description: "Total net spending in the inclusive date range"
  daysInPeriod:
    type: integer
    description: "Number of inclusive calendar days in the range"
  dateFrom:
    type: string
    format: date
    description: "Start date of the range"
  dateTo:
    type: string
    format: date
    description: "End date of the range"
