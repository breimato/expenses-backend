description: "Expense V1"
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Expense identifier"
  categoryId:
    type: integer
    format: int32
    description: "Category identifier"
  amount:
    type: string
    description: "Expense amount as decimal string"
  description:
    type: string
    description: "Expense description"
  expenseDate:
    type: string
    format: date
    description: "Expense date"
  movementType:
    $ref: './MovementTypeV1.yaml'
    description: "Movement direction"
  offsetsSpendingAverage:
    type: boolean
    description: >-
      Incomes: reduces net spending in analytics averages (e.g. reimbursements).
      Expenses: excludes the amount from analytics averages (e.g. savings/investments).
  reimbursedExpenseId:
    type: integer
    format: int32
    nullable: true
    description: >-
      Income only: optional link to the expense this reimbursement offsets.
      When set, category breakdown nets this amount against the linked expense category.
  createdAt:
    type: string
    format: date-time
    description: "Creation timestamp"
  updatedAt:
    type: string
    format: date-time
    description: "Last update timestamp"
