description: "Account invitation V1"
type: object
properties:
  id:
    type: integer
    format: int32
    description: "Invitation id"
  accountId:
    type: integer
    format: int32
    description: "Account id"
  token:
    type: string
    description: "Invitation token"
  expiresAt:
    type: string
    format: date-time
    description: "Expiration timestamp"
  status:
    type: string
    enum:
      - PENDING
      - ACCEPTED
      - EXPIRED
      - REVOKED
    description: "Invitation status"
