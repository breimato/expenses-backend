get:
  summary: "Get Profile V1"
  description: "Get the app profile"
  operationId: "GetProfileV1"
  tags:
    - get-profile-v1
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/ProfileV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
patch:
  summary: "Patch Profile V1"
  description: "Partially update the app profile"
  operationId: "PatchProfileV1"
  tags:
    - patch-profile-v1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PatchProfileV1Request.yaml'
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/ProfileV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
